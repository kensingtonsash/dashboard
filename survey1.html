<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDECE9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Survey — Kensington Sash</title>
<link rel="apple-touch-icon" href="/Logo%20slogan%202.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
/* ── Reset & base ── */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;
  background:#EDECE9;color:#1a1a1a;font-size:14px;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid #34453E;outline-offset:2px}
.hide{display:none!important}
.shell{max-width:760px;margin:0 auto;padding:0 1rem}

/* ── Topbar ── */
.topbar{
  position:sticky;top:0;z-index:40;background:#EDECE9;
  padding:calc(.75rem + env(safe-area-inset-top)) 1rem .75rem;
}
.topbar-inner{
  max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;
  padding:.7rem 1rem;border-radius:14px;background:#fff;border:1px solid #E8E6E1;
  box-shadow:0 1px 3px rgba(0,0,0,.05)
}
.topbar-inner img{height:30px;width:auto;display:block}
.back-btn{
  border:1px solid #E0DED8;background:#fff;color:#666;border-radius:8px;
  width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-size:15px
}
.back-btn:hover{border-color:#34453E;color:#34453E}
.sync-status{margin-left:auto;font-size:11px;color:#aaa;white-space:nowrap}

/* ── KPI cards ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{
  background:#fff;border:1px solid #E8E6E1;border-radius:12px;padding:14px 16px;
  position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)
}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#34453E;border-radius:3px 0 0 3px}
.kpi-label{font-size:10.5px;color:#999;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;font-weight:600}
.kpi-val{font-size:24px;font-weight:700;color:#1a1a1a;line-height:1}
.kpi-sub{font-size:11px;color:#aaa;margin-top:5px}

/* ── Cards ── */
.card{
  background:#fff;border:1px solid #E8E6E1;border-radius:14px;padding:1.1rem 1.2rem;
  margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)
}
.card-title{
  font-size:12px;font-weight:700;margin-bottom:14px;color:#999;display:flex;align-items:center;gap:7px;
  text-transform:uppercase;letter-spacing:.06em
}
.card-title i{font-size:14px;color:#34453E}
.card-title .count{margin-left:auto;font-weight:600;color:#bbb;letter-spacing:0;text-transform:none;font-size:11.5px}
.collapse-head{cursor:pointer;user-select:none;margin-bottom:0}
.collapse-head i.chev{margin-left:auto;font-size:15px;color:#bbb;transition:transform .2s}
.collapse-head.open i.chev{transform:rotate(180deg)}
.collapse-body{display:none;padding-top:16px}
.collapse-body.open{display:block}

/* ── Rows ── */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F2F1EE;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.row:last-child{border-bottom:none}
.row-left{flex:1;min-width:0}
.row-name{font-size:13.5px;font-weight:600;color:#1a1a1a}
.row-sub{font-size:11.5px;color:#999;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.empty{font-size:13px;color:#aaa;padding:10px 0}

/* ── Badges ── */
.badge{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;letter-spacing:.02em}
.b-pendinsurvey{background:#FEF1DC;color:#7D4B0A}
.b-scheduled{background:#EEEDFE;color:#4E44B5}
.b-active{background:#D8F5EC;color:#0D6B52}
.b-complete{background:#EBEBEA;color:#666}
.b-band{background:#F2F1EE;color:#777}

/* ── Buttons ── */
.btn-sm{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid #34453E;background:transparent;color:#34453E;font-weight:500;transition:all .15s}
.btn-sm:hover{background:#34453E;color:#fff}
.btn-main{font-size:13px;padding:9px 16px;border-radius:9px;border:1px solid #34453E;background:transparent;color:#34453E;font-weight:500;transition:all .15s}
.btn-main:hover{background:#34453E;color:#fff}
.btn-solid{font-size:14px;padding:13px;border:none;border-radius:10px;background:#34453E;color:#fff;font-weight:600;transition:background .15s}
.btn-solid:hover{background:#2a3830}
.btn-solid:disabled{opacity:.5}
.btn-ghost{font-size:14px;padding:13px 18px;border:1px solid #E0DED8;border-radius:10px;background:#fff;color:#666;font-weight:500}
.btn-ghost:hover{border-color:#34453E;color:#34453E}
.link{background:none;border:0;padding:0;color:#34453E;font-size:11.5px;text-decoration:underline;font-family:inherit}
.link-muted{background:none;border:0;padding:0;color:#bbb;font-size:11px;text-decoration:underline;font-family:inherit}

/* ── Fields ── */
.field{margin-bottom:10px}
.field label{display:block;font-size:10.5px;color:#999;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:5px}
.inp{
  width:100%;padding:11px 13px;border:1px solid #E8E6E1;border-radius:10px;background:#FAFAF8;
  font-family:inherit;font-size:16px;color:#1a1a1a
}
.inp:focus{border-color:#34453E;background:#fff;outline:none}
textarea.inp{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips label{
  display:flex;align-items:center;gap:7px;font-size:12px;padding:7px 11px;border:1px solid #E8E6E1;
  border-radius:20px;background:#FAFAF8;color:#666
}
.chips input{accent-color:#34453E;width:15px;height:15px}

/* ── Window rows ── */
.wrow{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #F2F1EE;align-items:start}
.wrow:last-of-type{border-bottom:none}
.wshot{
  width:54px;height:72px;padding:0;border:1px solid #E8E6E1;border-radius:10px;background:#FAFAF8;
  overflow:hidden;display:flex;align-items:center;justify-content:center;color:#c4c0b8;font-size:18px
}
.wshot img{width:100%;height:100%;object-fit:cover;display:block}
.wtop{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.wref{font-size:13px;font-weight:700;color:#1a1a1a;flex:0 0 auto}
.wpos{
  flex:1;min-width:0;border:0;border-bottom:1px solid #F2F1EE;background:none;padding:3px 0;
  font-family:inherit;font-size:13px;color:#444
}
.wpos:focus{outline:none;border-bottom-color:#34453E}
.wlab{
  display:block;font-size:9.5px;color:#999;text-transform:uppercase;letter-spacing:.07em;
  font-weight:600;margin-bottom:4px
}
.wdims{display:grid;grid-template-columns:1fr 12px 1fr;gap:6px;align-items:end}
.wdims .x{text-align:center;color:#c4c0b8;font-size:12px;padding-bottom:11px}
.wdims .inp{padding:9px;text-align:center}
.wsel{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.wsel .inp{padding:9px 8px;font-size:16px}
.wnote{
  width:100%;border:0;border-bottom:1px solid #F2F1EE;background:none;
  padding:5px 0;font-family:inherit;font-size:16px;color:#444
}
.wnote:focus{outline:none;border-bottom-color:#34453E}
.wnote::placeholder{color:#c4c0b8;font-size:13px}
.wfoot{display:flex;align-items:center;gap:8px;margin-top:7px}
.warea{font-size:12px;font-weight:600;color:#1a1a1a}
.wkill{margin-left:auto;background:none;border:0;color:#c9c5bd;font-size:14px;padding:2px 4px}
.addrow{
  width:100%;margin-top:14px;font-size:13px;padding:11px;border:1px dashed #D5D2CB;border-radius:10px;
  background:#FAFAF8;color:#34453E;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px
}
.addrow:hover{border-color:#34453E;background:#fff}

/* ── Bottom bar ── */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(237,236,233,.94);
  backdrop-filter:blur(8px);border-top:1px solid #E0DED8;
  padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom))
}
.bar-inner{max-width:760px;margin:0 auto;display:flex;gap:9px}
.bar-inner .btn-solid{flex:1}

/* ── Auth ── */
.auth-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.auth-card{
  width:100%;max-width:360px;background:#fff;border:1px solid #E8E6E1;border-radius:16px;
  padding:1.8rem 1.6rem;box-shadow:0 4px 20px rgba(0,0,0,.06);text-align:center
}
.auth-card img{height:32px;width:auto;margin-bottom:20px}
.auth-title{font-size:15px;font-weight:700;letter-spacing:-.01em}
.auth-sub{font-size:12.5px;color:#aaa;margin:5px 0 20px;line-height:1.5}
.auth-card .inp{margin-bottom:10px;text-align:left}
.auth-card .btn-solid{width:100%}
.auth-card .btn-ghost{width:100%;margin-top:9px}
.auth-err{font-size:12px;color:#A32D2D;margin-top:12px;min-height:16px;line-height:1.4}

/* ── Toast ── */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:#1a1a1a;color:#fff;padding:11px 16px;border-radius:10px;font-size:12.5px;z-index:60;
  max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s;
  box-shadow:0 4px 14px rgba(0,0,0,.18)
}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

                  'Casement Window','Front Door','French Doors','Bifold Doors','Patio Door'];

const isSash    = w => /Sash Window$/.test(w.product || '');

const sashUnits = w => w.product === 'Triple Sash Window' ? 3
                     : w.product === 'Double Sash Window' ? 2
                     : isSash(w) ? 1 : 0;
/* frame is retained: same fields and the same order-list counts */

  const s = [...new Set(j.windows.map(w => w.service).filter(Boolean))];

   ========================================================================== */
const PHOTO_DB = 'ks_photos', PHOTO_STORE = 'photos';
let _pdb = null;
const photoCache = {};                       // id -> dataURL
const isPhotoId  = v => typeof v === 'string' && v && !/^data:/.test(v);

function photoDB(){
  if(_pdb) return Promise.resolve(_pdb);
  return new Promise((res, rej) => {
    let r;
    try{ r = indexedDB.open(PHOTO_DB, 1); }catch(e){ return rej(e); }
    r.onupgradeneeded = () => r.result.createObjectStore(PHOTO_STORE);
    r.onsuccess = () => { _pdb = r.result; res(_pdb); };
    r.onerror   = () => rej(r.error);
  });
}
async function photoPut(id, dataUrl){
  const d = await photoDB();
  return new Promise((res, rej) => {
    const tx = d.transaction(PHOTO_STORE, 'readwrite');
    tx.objectStore(PHOTO_STORE).put(dataUrl, id);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function photoGet(id){
  if(!isPhotoId(id)) return id || null;        // legacy inline data URL passes straight through
  if(photoCache[id]) return photoCache[id];
  try{
    const d = await photoDB();
    return await new Promise((res, rej) => {
      const rq = d.transaction(PHOTO_STORE, 'readonly').objectStore(PHOTO_STORE).get(id);
      rq.onsuccess = () => { if(rq.result) photoCache[id] = rq.result; res(rq.result || null); };
      rq.onerror   = () => rej(rq.error);
    });
  }catch(e){ return null; }
}
async function photoDel(id){
  if(!isPhotoId(id)) return;
  try{
    const d = await photoDB();
    await new Promise(res => {
      const tx = d.transaction(PHOTO_STORE, 'readwrite');
      tx.objectStore(PHOTO_STORE).delete(id);
      tx.oncomplete = res; tx.onerror = res;
    });
  }catch(e){}
  delete photoCache[id];
}
const newPhotoId = () => 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);

/* fill any <img data-pid> that isn't showing its picture yet */
function hydratePhotos(root){
  (root || document).querySelectorAll('img[data-pid]').forEach(async img => {
    if(img.getAttribute('src')) return;
    const url = await photoGet(img.dataset.pid);
    if(url) img.src = url;
  });
}

/* one-time migration: pull any inline data-URL photos out of localStorage into IDB */
async function migratePhotos(){
  let changed = false;
  for(const j of db){
    for(const w of j.windows){
      if(w.photo && /^data:/.test(w.photo)){
        const id = newPhotoId();
        try{ await photoPut(id, w.photo); photoCache[id] = w.photo; w.photo = id; changed = true; }
        catch(e){ /* IDB unavailable — leave inline */ }
      }
    }
  }
  if(changed) save();
}

/* '85 Old Brompton Road, SW7' -> 'Old Brompton'. Overridden by the Reference field. */
const REF_STOP  = /^(flat|apt|apartment|unit|no|the|ground|first|second|third|floor|basement|maisonette|house)$/i;
const REF_MOD   = /^(old|new|great|little|north|south|east|west|upper|lower|st|saint)$/i;
const REF_THORO = /^(road|rd|street|st|crescent|gardens|garden|square|sq|place|pl|mews|lane|avenue|ave|terrace|walk|grove|hill|row|park|close|drive|way|court|villas|rise|vale|embankment|quay|wharf|green|common|bridge|broadway|parade|path|end)$/i;
const REF_OUT   = /^[A-Z]{1,2}\d[A-Z\d]?$/i;

function siteRef(j){
  if(j.spec && j.spec.ref) return j.spec.ref.trim();
  let toks = String(j.address || '').split(/[\s,]+/).filter(Boolean);
  const pc = toks.findIndex(t => REF_OUT.test(t));
  if(pc > 0) toks = toks.slice(0, pc);
  toks = toks.filter(t => /^[A-Za-z][A-Za-z'\u2019-]*$/.test(t) && !REF_STOP.test(t));
  while(toks.length > 1 && REF_THORO.test(toks[toks.length - 1])) toks.pop();
  if(!toks.length) return '';
  return REF_MOD.test(toks[0]) && toks.length > 1 ? toks[0] + ' ' + toks[1] : toks[0];
}
/* Materials, derived from the sash windows on repairs.
   2 lifts + 1 lock per sash unit · 1 pack of 19mm stops per 2 units · 4 pulleys per unit when selected */
function materialList(ws){
  const rep = ws.filter(w => isRepair(w) && isSash(w));
  const units   = rep.reduce((t,w) => t + sashUnits(w), 0);
  const pulleys = rep.filter(w => w.newPulleys && hasPulleys(w)).reduce((t,w) => t + sashUnits(w), 0);
  const out = [];
  if(units){
    const packs = Math.ceil(units / 2);
    out.push(['Sash lifts', units * 2 + ' no.']);
    out.push(['Sash locks', units + ' no.']);
    out.push(['Sash Stops 19mm', packs + (packs === 1 ? ' pack' : ' packs')]);
  }
  if(pulleys) out.push(['Sash pulleys', pulleys * 4 + ' no.']);
  return out;
}

/* the number the supplier quotes against */
function requestNo(j){
  return j.quote_no || j.enquiry_id || ('S' + String(j.id).slice(-6));
}

/* ---------- auth ---------- */
async function signIn(email, password){
  const r = await fetch(BASE + '/auth/v1/token?grant_type=password', {
    method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY },
    body: JSON.stringify({ email, password })
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.msg || 'Those details were not accepted');
  session = { token:d.access_token, refresh:d.refresh_token, email };
  write(K_SESSION, session);
}
async function refresh(){
  if(!session?.refresh) return false;
  try{
    const r = await fetch(BASE + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY },
      body: JSON.stringify({ refresh_token: session.refresh })
    });
    if(!r.ok) return false;
    const d = await r.json();
    session = { ...session, token:d.access_token, refresh:d.refresh_token };
    write(K_SESSION, session); return true;
  }catch(e){ return false }
}
async function api(path, opts = {}, retry = true){
  const r = await fetch(BASE + '/rest/v1/' + path, { ...opts, headers:{
    'Content-Type':'application/json', apikey:SB_KEY,
    Authorization:'Bearer ' + (session?.token || SB_KEY), ...(opts.headers || {}) } });
  if(r.status === 401 && retry && await refresh()) return api(path, opts, false);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.status === 204 ? null : r.json();
}

/* ---------- bookings ---------- */
async function loadBooked(){
  if(!session) return;
  try{
    const rows = await api('enquiries?select=*&survey_date=not.is.null&surveyed_at=is.null&order=survey_date.asc');
    booked = rows.map(r => ({
      enquiry_id:r.id, quote_no:r.quote_no || '',
      client:  pick(r, ['client','name','client_name','contact_name']),
      address: pick(r, ['address','property_address','site_address','property']),
      phone:   pick(r, ['phone','telephone','mobile']),
      service: pick(r, ['service','job_type','service_type','enquiry_type']),
      surveyor:r.surveyor || '', survey_date:r.survey_date
    }));
    write(K_BOOKED, booked);
  }catch(e){ /* offline — keep the cached list */ }
}

/* ---------- routing ---------- */
function render(){
  const login = state.screen === 'login';
  el('topbar').classList.toggle('hide', login);
  el('bar').classList.toggle('hide', login);
  el('back').classList.toggle('hide', state.screen === 'list');
  ({ login:sLogin, list:sList, survey:sSurvey }[state.screen])(el('view'), el('barInner'));
  netLabel(); window.scrollTo(0,0);
}

/* ---------- login ---------- */
function sLogin(v,b){
  v.className = ''; b.innerHTML = '';
  v.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <img src="${LOGO}" alt="Kensington Sash">
      <div class="auth-title">Sync to the dashboard</div>
      <div class="auth-sub">Only needed to send surveys through. The survey and the PDF work without signing in.</div>
      <input class="inp" id="email" type="email" inputmode="email" placeholder="Email" autocomplete="username" autocapitalize="none">
      <input class="inp" id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn-solid" id="go">Sign in</button>
      <button class="btn-ghost" id="skip">Not now</button>
      <div class="auth-err" id="err"></div>
    </div></div>`;
  const go = el('go');
  const attempt = async () => {
    el('err').textContent = ''; go.disabled = true; go.textContent = 'Signing in…';
    try{
      await signIn(el('email').value.trim(), el('pw').value);
      state.screen = 'list'; render();
      await loadBooked();
      for(const j of db.filter(x => !x.synced && x.windows.some(w => w.w || w.h))) await syncJob(j);
      render();
    }catch(e){
      el('err').textContent = navigator.onLine ? e.message : 'No signal — try again with a connection.';
      go.disabled = false; go.textContent = 'Sign in';
    }
  };
  go.onclick = attempt;
  el('skip').onclick = () => { state.screen = 'list'; render() };
  el('pw').onkeydown = e => { if(e.key === 'Enter') attempt() };
}

        return `<button class="row" data-book="${esc(x.enquiry_id)}">
          <div class="row-left">
            <div class="row-name">${esc(x.client) || 'Booked survey'}</div>
            <div class="row-sub">${esc(x.address) || 'No address on the booking'}</div>
          </div>

            <span class="badge ${isToday ? 'b-active' : 'b-scheduled'}">${isToday ? 'Today' : d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>
            <i class="ti ti-chevron-right" style="color:#ccc"></i>
          </div></button>`;
      }).join('')}
    </div>` : '') +

    `<div class="card">
      <div class="card-title"><i class="ti ti-ruler-measure"></i>Surveys on this phone${db.length ? `<span class="count">${db.length}</span>` : ''}</div>
      ${db.length ? db.map(j => {
        const n = j.windows.filter(w => w.w || w.h).length;
        return `<button class="row" data-open="${j.id}">
          <div class="row-left">
            <div class="row-name">${esc(j.client) || 'Untitled survey'}</div>
            <div class="row-sub">${esc(j.address) || 'No address'} · ${n} ${n === 1 ? 'window' : 'windows'}</div>
          </div>
          <div class="row-actions">
            ${j.synced ? '<span class="badge b-complete">Sent</span>' : '<span class="badge b-pendinsurvey">Unsent</span>'}
            <i class="ti ti-chevron-right" style="color:#ccc"></i>
          </div></button>`;
      }).join('') : `<div class="empty">Nothing started yet.</div>`}
    </div>

    <div style="text-align:center;padding:4px 0 10px">
      ${session
        ? `<span style="font-size:11px;color:#bbb">${esc(session.email)}</span> · <button class="link-muted" id="out">sign out</button>`
        : `<button class="link" id="in">Sign in to sync with the dashboard</button>`}
    </div>`;

  b.innerHTML = `<button class="btn-solid" id="new">Start a survey</button>`;
  if(el('in'))  el('in').onclick  = () => { state.screen = 'login'; render() };
  if(el('out')) el('out').onclick = () => {
    session = null; booked = [];
    try{ localStorage.removeItem(K_SESSION); localStorage.removeItem(K_BOOKED) }catch(e){}
    render();
  };
  el('new').onclick = () => start({});
  v.querySelectorAll('[data-book]').forEach(n => n.onclick = () => start(booked.find(x => String(x.enquiry_id) === n.dataset.book)));
  v.querySelectorAll('[data-open]').forEach(n => n.onclick = () => { state.jobId = n.dataset.open; state.screen = 'survey'; render() });

function start(src = {}){
  db.unshift({
    id:'s_' + Date.now(), created:new Date().toISOString(),
    enquiry_id:src.enquiry_id || null, quote_no:src.quote_no || '',
    client:src.client || '', address:src.address || '', phone:src.phone || '',
    surveyor:src.surveyor || 'Luke Robertson',
    site:{}, spec:{},
    windows:[{ label:'W1', position:'', w:'', h:'', photo:'', notes:'',
               product:PRODUCTS[0], mechanism:'', staffBead:'', partingBead:'', newPulleys:false,
               service:SERVICE_VALUES.includes(src.service) ? src.service : SERVICE_VALUES[0],
               glazing:'' }],
    synced:false
  });
  save();
  state.jobId = db[0].id; state.screen = 'survey'; state.openSpec = !src.enquiry_id;
  render();
}

      w.service = s.value;
      if(!isRepair(w)){ w.staffBead = ''; w.partingBead = ''; w.newPulleys = false }
      j.synced = false; save(); netLabel(); redrawRow(i);
    });
    R.querySelectorAll('.gl').forEach(s => s.onchange = () => {
      j.windows[+s.dataset.i].glazing = s.value; j.synced = false; save(); netLabel();
    });
    R.querySelectorAll('[data-shoot]').forEach(btn => btn.onclick = () => shoot(+btn.dataset.shoot));
    R.querySelectorAll('[data-kill]').forEach(btn => btn.onclick = () => {
      const i = +btn.dataset.kill;
      if(!confirm('Remove ' + j.windows[i].label + '?')) return;
      photoDel(j.windows[i].photo);                 // reclaim the image from IDB
      j.windows.splice(i,1);
      j.windows.forEach((x,n) => x.label = 'W' + (n+1));
      j.synced = false; save(); rows();
    });
  }

  function shoot(i){
    const f = document.createElement('input');
    f.type = 'file'; f.accept = 'image/*'; f.capture = 'environment';
    f.onchange = async () => {
      if(!f.files[0]) return;
      try{
        const dataUrl = await shrink(f.files[0]);
        const w = j.windows[i];
        const id = isPhotoId(w.photo) ? w.photo : newPhotoId();   // reuse id when replacing
        photoCache[id] = dataUrl;
        await photoPut(id, dataUrl);
        w.photo = id; j.synced = false; save(); redrawRow(i);
      }catch(e){ toast("Couldn't read that photo — take it again") }
    };
    f.click();
  }
}

/* ---------- photo downscale ---------- */
function shrink(f, max = 1400, q = .72){
  return new Promise((res,rej) => {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej() };
    img.src = url;
  });
}

/* ---------- supplier schedule PDF ---------- */
async function exportPdf(j){
  if(!window.jspdf){ toast('Still loading — try again in a moment'); return }
  const live = j.windows.filter(w => w.w || w.h || w.photo);
  if(!live.length){ toast('Nothing to send yet'); return }

  /* pull every photo into the cache before jsPDF (which is synchronous) runs */
  await Promise.all(live.filter(w => w.photo).map(w => photoGet(w.photo)));

  const { jsPDF } = window.jspdf;
  const d = new jsPDF({ unit:'mm', format:'a4' });
  const M = 18, W = 210, ink = [26,26,26], grn = [52,69,62], gry = [140,138,132], hair = [232,230,225];
  let y = M;

  try{ d.addImage(LOGO, 'PNG', M, y, 55, 10.8) }
  catch(e){ d.setFont('helvetica','bold'); d.setFontSize(13); d.setTextColor(...grn); d.text('KENSINGTON SASH', M, y + 7) }
  d.setFont('helvetica','normal'); d.setFontSize(7.5); d.setTextColor(...gry);
  d.text('WINDOW SURVEY', W - M, y + 4, { align:'right' });
  d.text(new Date(j.created).toLocaleDateString('en-GB'), W - M, y + 8.4, { align:'right' });
  y += 15.5; d.setDrawColor(...grn); d.setLineWidth(.5); d.line(M, y, W - M, y); y += 9.5;

  const ref = siteRef(j);
  const meta = [['Reference', ref ? "'" + ref + "'" : '—'], ['Request no.', requestNo(j)],
                ['Service', jobService(j) || '—'], ['Surveyor', j.surveyor || 'Luke Robertson']]
    .concat([['Paint colour',j.spec.finish],['Ironmongery',j.spec.iron]].filter(r => r[1]))
    .concat(j.quote_no ? [['Reference', j.quote_no]] : []);
  meta.forEach((r,i) => {
    const ry = y + Math.floor(i/2) * 6, x = M + (i % 2) * 88;
    d.setFontSize(6.5); d.setTextColor(...gry); d.text(r[0].toUpperCase(), x, ry);
    d.setFontSize(9);   d.setTextColor(...ink); d.text(String(r[1]).slice(0,44), x + 25, ry);
  });
  y += Math.ceil(meta.length/2) * 6 + 8;

  // one block per window: photo left, measurements beside it
  const PW = 38, PH = 50;           // photo box
  const TX = M + PW + 8;            // text column

  live.forEach((w,i) => {
    const pic = w.photo ? photoCache[w.photo] : null;
    const a = sqm(w.w,w.h);
    const hasNote  = !!w.notes;
    const hasBeads = isRepair(w) && (w.staffBead || w.partingBead);
    const textH = 22 + (w.position ? 5 : 0) + 11 + (hasBeads ? 11 : 0) + (hasNote ? 11 : 0) + 3;
    const blockH = Math.max(pic ? PH : 24, textH) + 8;
    if(y + blockH > 278){ d.addPage(); y = M }
    const top = y;

    if(pic){
      try{
        const p = d.getImageProperties(pic);
        const s = Math.min(PW / p.width, PH / p.height);
        const iw = p.width * s, ih = p.height * s;
        d.addImage(pic, 'JPEG', M + (PW - iw)/2, top, iw, ih);
      }catch(e){}
    } else {
      d.setDrawColor(...hair); d.setLineWidth(.25);
      d.rect(M, top, PW, 22);
      d.setFontSize(6.5); d.setTextColor(...gry);
      d.text('NO PHOTO', M + PW/2, top + 12.5, { align:'center' });
    }

    let ty = top + 4.5;
    d.setFont('helvetica','bold'); d.setFontSize(11); d.setTextColor(...ink);
    d.text(w.label, TX, ty);
    if(a){
      d.setFont('helvetica','bold'); d.setFontSize(10);
      d.text(a.toFixed(2) + ' m²', W - M, ty, { align:'right' });
    }
    d.setFont('helvetica','normal');

    if(w.position){
      ty += 5;
      d.setFontSize(8.5); d.setTextColor(...gry);
      d.text(String(w.position).slice(0,52), TX, ty);
    }

    ty += 8;
    [['WIDTH', w.w ? w.w + ' mm' : '—'],
     ['HEIGHT', w.h ? w.h + ' mm' : '—'],
     ['PRODUCT', w.product || '—']].forEach((r,c) => {
      const x = TX + c * 34;
      d.setFontSize(6.5); d.setTextColor(...gry); d.text(r[0], x, ty);
      d.setFontSize(9.5); d.setTextColor(...ink); d.text(r[1], x, ty + 4.6);
    });

    ty += 11;
    const line2 = [['SERVICE', w.service || '—'], ['GLAZING', w.glazing || '—']];
    if(isSash(w) && w.mechanism) line2.push(['MECHANISM', w.mechanism]);
    line2.forEach((r,c) => {
      const x = TX + c * 34;
      d.setFontSize(6.5); d.setTextColor(...gry); d.text(r[0], x, ty);
      d.setFontSize(9);   d.setTextColor(...ink); d.text(String(r[1]).slice(0,24), x, ty + 4.6);
    });

    if(hasBeads){
      ty += 11;
      [['STAFF BEAD', w.staffBead || '—'],
       ['PARTING BEAD', w.partingBead || '—']].forEach((r,c) => {
        const x = TX + c * 44;
        d.setFontSize(6.5); d.setTextColor(...gry); d.text(r[0], x, ty);
        d.setFontSize(9);   d.setTextColor(...ink); d.text(String(r[1]).slice(0,30), x, ty + 4.6);
      });
    }

    if(hasNote){
      ty += 11;
      d.setFontSize(8); d.setTextColor(...gry);
      d.text(d.splitTextToSize(String(w.notes), W - TX - M), TX, ty);
    }

    y = top + blockH;
    if(i < live.length - 1){
      d.setDrawColor(...hair); d.setLineWidth(.25);
      d.line(M, y - 4, W - M, y - 4);
    }
  });

  // totals
  const tot = live.reduce((t,w) => t + sqm(w.w,w.h), 0);
  if(y > 262){ d.addPage(); y = M }
  y += 2;
  d.setDrawColor(...grn); d.setLineWidth(.4); d.line(M, y, W - M, y); y += 6;
  d.setFont('helvetica','bold'); d.setFontSize(9.5); d.setTextColor(...ink);
  d.text(live.length + (live.length === 1 ? ' unit' : ' units'), M, y);
  d.text(tot.toFixed(2) + ' m² total', W - M, y, { align:'right' });
  d.setFont('helvetica','normal');

  if(j.spec.notes){
    y += 11; if(y > 262){ d.addPage(); y = M }
    d.setFontSize(6.5); d.setTextColor(...gry); d.text('NOTES', M, y); y += 5;
    d.setFontSize(9); d.setTextColor(...ink); d.text(d.splitTextToSize(j.spec.notes, W - M*2), M, y);
  }

  const mats = materialList(live);
  if(mats.length){
    y += 14; if(y > 235){ d.addPage(); y = M }
    d.setDrawColor(...grn); d.setLineWidth(.4); d.line(M, y, W - M, y); y += 6;
    d.setFont('helvetica','bold'); d.setFontSize(9.5); d.setTextColor(...ink);
    d.text('ORDER LIST', M, y);
    d.setFont('helvetica','normal'); y += 7.5;
    mats.forEach(m => {
      if(y > 280){ d.addPage(); y = M }
      d.setFontSize(9); d.setTextColor(...ink);
      d.text(m[0], M, y);
      d.text(m[1], W - M, y, { align:'right' });
      d.setDrawColor(...hair); d.setLineWidth(.2); d.line(M, y + 2.4, W - M, y + 2.4);
      y += 7.5;
    });
  }

  d.save('Survey — ' + (ref || requestNo(j)) + '.pdf');
  syncJob(j);
}

/* ---------- write back to the same enquiry row ---------- */
async function syncJob(j){
  const payload = {
    id:j.id, created:j.created, enquiry_id:j.enquiry_id, surveyor:j.surveyor,
    client:j.client, address:j.address, service:jobService(j), site:j.site, spec:j.spec,
    windows:j.windows.filter(w => w.w || w.h).map(w => ({
      label:w.label, position:w.position, width:Number(w.w) || null, height:Number(w.h) || null,
      sqm:Number(sqm(w.w,w.h).toFixed(3)), band:band(sqm(w.w,w.h)),
      product:w.product || null, service:w.service || null, glazing:w.glazing || null,
      mechanism:isSash(w) ? (w.mechanism || null) : null,
      staff_bead:isRepair(w) ? (w.staffBead || null) : null,
      parting_bead:isRepair(w) ? (w.partingBead || null) : null,
      notes:w.notes }))
  };
  if(!session){ toast('PDF saved · sign in to send it to the dashboard'); return }
  try{
    await api('rpc/save_survey', { method:'POST', body: JSON.stringify({ payload }) });
    j.synced = true; save(); toast('PDF saved · sent to the dashboard'); netLabel();
  }catch(e){ toast('PDF saved · will send when there is signal') }
}

function netLabel(){
  const pending = db.filter(j => !j.synced && j.windows.some(w => w.w || w.h)).length;
  el('net').textContent = !session ? 'On this phone'
    : !navigator.onLine ? 'Offline' : pending ? pending + ' to send' : 'Synced';
}
addEventListener('online', async () => {
  netLabel(); await loadBooked();
  for(const j of db.filter(x => !x.synced && x.windows.some(w => w.w || w.h))) await syncJob(j);
  render();
});
addEventListener('offline', netLabel);
el('back').onclick = () => { state.screen = 'list'; render() };

/* ---------- boot, with ?e= deep link from the calendar ---------- */
(async function boot(){
  el('mark').src = LOGO;
  await migratePhotos();                    // lift any legacy inline photos out of localStorage
  state.screen = 'list'; render();
  if(!session) return;
  await loadBooked();
  const e = new URLSearchParams(location.search).get('e');
  if(e){
    const existing = db.find(j => j.enquiry_id === e);
    if(existing){ state.jobId = existing.id; state.screen = 'survey' }
    else { const bk = booked.find(x => String(x.enquiry_id) === e); if(bk){ start(bk); return } }
  }
  render();
})();
</script>
