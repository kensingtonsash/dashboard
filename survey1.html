<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#34453E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Survey — Kensington Sash</title>
<link rel="apple-touch-icon" href="Logo%20slogan%202.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{
  --charcoal:#2c2b26; --cream:#F4F1EB; --stone:#E7E2D9; --accent:#9c9484;
  --green:#34453E; --body:#5c5a52; --white:#fff;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  --serif:'Newsreader',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--cream);color:var(--charcoal);font-family:var(--sans);
  font-size:16px;line-height:1.45;padding-bottom:calc(90px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.hide{display:none!important}

.top{
  position:sticky;top:0;z-index:30;background:var(--green);
  padding:calc(13px + env(safe-area-inset-top)) 18px 13px;display:flex;align-items:center;gap:14px
}
.top .mark{font-family:var(--serif);font-size:19px;letter-spacing:.02em;color:var(--cream);line-height:1}
.top .mark em{font-style:normal;opacity:.6}
.top .back{background:none;border:0;color:var(--cream);font-size:27px;line-height:.7;padding:0 2px 5px 0;margin-left:-4px}
.top .status{margin-left:auto;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);opacity:.7}
.wrap{max-width:660px;margin:0 auto;padding:22px 16px 0}

h1{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--body);font-size:13.5px;margin:0 0 22px}
.sub button{background:none;border:0;padding:0;color:var(--green);text-decoration:underline;font-size:13.5px}
.eyebrow{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
  margin:26px 0 11px;display:flex;align-items:center;gap:12px
}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--stone)}

input,select,textarea{
  width:100%;padding:13px 14px;border:1px solid var(--stone);border-radius:2px;background:var(--white);
  font-family:inherit;font-size:17px;color:var(--charcoal)
}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:none}
textarea{min-height:74px;resize:vertical;font-size:16px}
label.f{display:block;margin-bottom:15px}
label.f>span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--body);margin-bottom:6px}

details{border-top:1px solid var(--stone);border-bottom:1px solid var(--stone);margin-bottom:6px}
summary{list-style:none;padding:15px 0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--body);display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';margin-left:auto;font-size:18px;color:var(--accent);line-height:1}
details[open] summary::after{content:'–'}
details .inner{padding:4px 0 10px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.checks label{display:flex;align-items:center;gap:9px;padding:10px 13px;border:1px solid var(--stone);border-radius:2px;background:var(--white);font-size:14px}
.checks input{width:19px;height:19px;padding:0;margin:0;accent-color:var(--green)}

/* ---------- the survey row: everything happens here ---------- */
.row{
  display:grid;grid-template-columns:66px 1fr;gap:12px;align-items:start;
  background:var(--white);border:1px solid var(--stone);border-radius:2px;
  padding:12px;margin-bottom:9px
}
.row .shotbtn{
  width:66px;height:88px;padding:0;border:1px solid var(--stone);border-radius:2px;
  background:var(--cream);overflow:hidden;display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-size:9px;letter-spacing:.12em;text-align:center;line-height:1.6
}
.row .shotbtn img{width:100%;height:100%;object-fit:cover;display:block}
.row .ref{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.row .ref b{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1;flex:0 0 auto}
.row .ref input{border:0;border-bottom:1px solid var(--stone);border-radius:0;padding:3px 0;font-size:14px;background:none}
.row .ref input:focus{border-bottom-color:var(--green)}
.row .dims{display:grid;grid-template-columns:1fr 14px 1fr;gap:6px;align-items:center}
.row .dims .x{text-align:center;color:var(--accent);font-family:var(--serif)}
.row .dims input{padding:10px;text-align:center;font-size:16px}
.row .area{
  margin-top:7px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
  display:flex;gap:9px;align-items:center
}
.row .area em{font-style:normal;font-family:var(--serif);font-size:15px;letter-spacing:0;text-transform:none;color:var(--charcoal)}
.row .kill{background:none;border:0;padding:4px 0 0;font-size:11px;color:var(--accent);text-decoration:underline;letter-spacing:.04em}

.addrow{
  width:100%;padding:16px;border:1px dashed var(--accent);border-radius:2px;background:none;
  color:var(--green);font-size:15px;margin:2px 0 4px
}
.tally{font-family:var(--serif);font-size:15px;color:var(--body);margin:16px 0 0}
.empty-state{border:1px dashed var(--stone);border-radius:2px;padding:34px 20px;text-align:center;color:var(--body);font-size:14px}

/* cards on the list screen */
.card{
  display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:var(--white);
  border:1px solid var(--stone);border-radius:2px;padding:15px 16px;margin-bottom:9px
}
.card .grow{min-width:0;flex:1}
.card .lab{font-family:var(--serif);font-size:19px;line-height:1.15}
.card .pos{font-size:13px;color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .dim{text-align:right;font-size:12px;color:var(--body);white-space:nowrap;line-height:1.3}
.card .dim b{display:block;font-family:var(--serif);font-weight:500;font-size:15px;color:var(--charcoal)}
.card .when{
  flex:0 0 auto;text-align:center;font-family:var(--serif);border-right:1px solid var(--stone);
  padding-right:14px;min-width:44px;line-height:1
}
.card .when b{display:block;font-size:22px;font-weight:400;color:var(--green)}
.card .when span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-family:var(--sans)}

.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--cream);border-top:1px solid var(--stone);
  display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto
}
.btn{flex:1;padding:17px;border:0;border-radius:2px;background:var(--green);color:var(--cream);font-size:15px}
.btn.ghost{flex:0 0 auto;background:none;border:1px solid var(--stone);color:var(--charcoal);padding:17px 22px}
.btn:disabled{opacity:.45}

.login{max-width:370px;margin:0 auto;padding:min(13vh,86px) 22px 0;text-align:center}
.login img{width:100%;max-width:280px;margin:0 auto 32px;display:block;mix-blend-mode:multiply}
.login p.note{font-size:13px;color:var(--body);margin:0 0 24px}
.login label.f{text-align:left}
.login .btn{width:100%;margin-top:4px}
.err{color:#8a3a2e;font-size:13px;margin:14px 0 0;min-height:18px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));
  background:var(--charcoal);color:var(--cream);padding:13px 18px;border-radius:2px;font-size:14px;
  z-index:60;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s
}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top hide" id="top">
  <button class="back hide" id="back" aria-label="Back">&lsaquo;</button>
  <div class="mark">KENSINGTON<em>SASH</em></div>
  <div class="status" id="net"></div>
</div>

<div id="view"></div>
<div class="bar hide" id="bar"></div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   Kensington Sash — Surveyor
   One screen per survey. Rows, not screens. Password once, then never.
   ========================================================================== */

const BASE   = 'https://wuzcvgucszxoefcscqkd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1emN2Z3Vjc3p4b2VmY3NjcWtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0ODU3NjAsImV4cCI6MjA5ODA2MTc2MH0.rnibj12j6stQHFbS3lkKhNSvKYmCi_sM5s-vLLmTg88';
const LOGO_URL = 'Logo%20slogan%202.png';
let LOGO_DATA = null;   // fetched once, reused for the PDF letterhead
async function loadLogo(){
  if(LOGO_DATA) return;
  try{
    const r = await fetch(LOGO_URL);
    if(!r.ok) return;
    const b = await r.blob();
    LOGO_DATA = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b) });
  }catch(e){ /* letterhead falls back to type */ }
}

const K_SURVEYS = 'ks_surveys_v3', K_SESSION = 'ks_session_v1', K_BOOKED = 'ks_booked_v1';
const TIMBERS  = ['Engineered Redwood','Red Grandis Hardwood','FSC Accoya'];
const GLAZING  = ['Single','Laminated','Double','Slimline double','Vacuum'];
const SERVICES = ['Sash Repairs','New Sashes into Existing Frames','Full Replacement','Mixed'];

let db      = read(K_SURVEYS, []);
let booked  = read(K_BOOKED, []);
let session = read(K_SESSION, null);
let state   = { screen:'list', jobId:null };

function read(k, fb){ try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v }catch(e){ return fb } }
function write(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){ toast('Storage full — export the PDF now') } }
const save = () => write(K_SURVEYS, db);
const el = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])) }
function toast(m){ const t = el('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800) }
function job(){ return db.find(j => j.id === state.jobId) }
function sqm(w,h){ return (Number(w) > 0 && Number(h) > 0) ? (w*h)/1e6 : 0 }
function band(a){ return !a ? '' : a <= 1.7 ? 'Band 1' : a <= 2.3 ? 'Band 2' : 'Band 3' }
function pick(r, keys){ for(const k of keys){ if(r[k]) return r[k] } return '' }

/* ---------- auth: once ---------- */
async function signIn(email, password){
  const r = await fetch(BASE + '/auth/v1/token?grant_type=password', {
    method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY },
    body: JSON.stringify({ email, password })
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.msg || 'Those details were not accepted');
  session = { token:d.access_token, refresh:d.refresh_token, email };
  write(K_SESSION, session);
}
async function refresh(){
  if(!session?.refresh) return false;
  try{
    const r = await fetch(BASE + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY },
      body: JSON.stringify({ refresh_token: session.refresh })
    });
    if(!r.ok) return false;
    const d = await r.json();
    session = { ...session, token:d.access_token, refresh:d.refresh_token };
    write(K_SESSION, session); return true;
  }catch(e){ return false }
}
async function api(path, opts = {}, retry = true){
  const r = await fetch(BASE + '/rest/v1/' + path, { ...opts, headers:{
    'Content-Type':'application/json', apikey:SB_KEY,
    Authorization:'Bearer ' + (session?.token || SB_KEY), ...(opts.headers || {}) } });
  if(r.status === 401 && retry && await refresh()) return api(path, opts, false);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.status === 204 ? null : r.json();
}

/* ---------- bookings ---------- */
async function loadBooked(){
  try{
    const rows = await api('enquiries?select=*&survey_date=not.is.null&surveyed_at=is.null&order=survey_date.asc');
    booked = rows.map(r => ({
      enquiry_id:r.id, quote_no:r.quote_no || '',
      client:  pick(r, ['client','name','client_name','contact_name']),
      address: pick(r, ['address','property_address','site_address','property']),
      phone:   pick(r, ['phone','telephone','mobile']),
      service: pick(r, ['service','job_type','service_type','enquiry_type']),
      surveyor:r.surveyor || '', survey_date:r.survey_date
    }));
    write(K_BOOKED, booked);
  }catch(e){ /* offline — keep the cached list */ }
}

/* ---------- routing ---------- */
function render(){
  el('top').classList.toggle('hide', state.screen === 'login');
  el('bar').classList.toggle('hide', state.screen === 'login');
  el('back').classList.toggle('hide', state.screen === 'list');
  ({ login:sLogin, list:sList, survey:sSurvey }[state.screen])(el('view'), el('bar'));
  netLabel(); window.scrollTo(0,0);
}

/* ---------- login ---------- */
function sLogin(v,b){
  v.className = ''; b.innerHTML = '';
  v.innerHTML = `
    <div class="login">
      <img src="${LOGO_URL}" alt="Kensington Sash — Sash Window Specialists">
      <p class="note">Only needed to sync to the dashboard. The survey and the PDF work without it.</p>
      <label class="f"><span>Email</span><input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none"></label>
      <label class="f"><span>Password</span><input id="pw" type="password" autocomplete="current-password"></label>
      <button class="btn" id="go">Sign in</button>
      <p class="err" id="err"></p>
      <button class="btn ghost" id="skip" style="width:100%;margin-top:10px">Not now</button>
    </div>`;
  const go = el('go');
  const attempt = async () => {
    el('err').textContent = ''; go.disabled = true; go.textContent = 'Signing in…';
    try{
      await signIn(el('email').value.trim(), el('pw').value);
      state.screen = 'list'; render();
      await loadBooked();
      for(const j of db.filter(x => !x.synced && x.windows.some(w => w.w || w.h))) await syncJob(j);
      render();
    }catch(e){
      el('err').textContent = navigator.onLine ? e.message : 'No signal — sign in once with a connection.';
      go.disabled = false; go.textContent = 'Sign in';
    }
  };
  go.onclick = attempt;
  el('skip').onclick = () => { state.screen = 'list'; render() };
  el('pw').onkeydown = e => { if(e.key === 'Enter') attempt() };
}

/* ---------- list ---------- */
function sList(v,b){
  v.className = 'wrap';
  const open = new Set(db.map(j => j.enquiry_id).filter(Boolean));
  const todo = booked.filter(x => !open.has(x.enquiry_id));

  v.innerHTML = `<h1>Surveys</h1>
    <p class="sub">${session
      ? esc(session.email) + ' · <button id="out">sign out</button>'
      : 'Saving to this phone · <button id="in">sign in to sync</button>'}</p>` +
    (todo.length ? `<p class="eyebrow">Booked</p>` + todo.map(x => {
      const d = new Date(x.survey_date);
      return `<button class="card" data-book="${esc(x.enquiry_id)}">
        <div class="when"><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-GB',{month:'short'})}</span></div>
        <div class="grow"><div class="lab">${esc(x.client) || 'Booked survey'}</div>
        <div class="pos">${esc(x.address) || 'No address on the booking'}</div></div></button>`;
    }).join('') : '') +
    `<p class="eyebrow">On this phone</p>` +
    (db.length ? db.map(j => `<button class="card" data-open="${j.id}">
        <div class="grow"><div class="lab">${esc(j.client) || 'Untitled'}</div>
        <div class="pos">${esc(j.address) || 'No address'}</div></div>
        <div class="dim"><b>${j.windows.length}</b>${j.windows.length === 1 ? 'window' : 'windows'}${j.synced ? '' : ' · unsent'}</div>
      </button>`).join('')
      : `<div class="empty-state">Nothing started. Open a booked survey, or start a blank one.</div>`);

  b.innerHTML = `<button class="btn" id="new">Start a blank survey</button>`;
  if(el('in')) el('in').onclick = () => { state.screen = 'login'; render() };
  if(el('out')) el('out').onclick = () => {
    session = null; booked = [];
    try{ localStorage.removeItem(K_SESSION); localStorage.removeItem(K_BOOKED) }catch(e){}
    state = { screen:'login' }; render();
  };
  el('new').onclick = () => start({});
  v.querySelectorAll('[data-book]').forEach(n => n.onclick = () => start(booked.find(x => String(x.enquiry_id) === n.dataset.book)));
  v.querySelectorAll('[data-open]').forEach(n => n.onclick = () => { state.jobId = n.dataset.open; state.screen = 'survey'; render() });
}

function start(src = {}){
  db.unshift({
    id:'s_' + Date.now(), created:new Date().toISOString(),
    enquiry_id:src.enquiry_id || null, quote_no:src.quote_no || '',
    client:src.client || '', address:src.address || '', phone:src.phone || '',
    service:SERVICES.includes(src.service) ? src.service : SERVICES[0],
    surveyor:src.surveyor || 'Luke Robertson',
    site:{}, spec:{}, windows:[{ label:'W1', position:'', w:'', h:'', photo:'', notes:'' }], synced:false
  });
  save(); state.jobId = db[0].id; state.screen = 'survey'; render();
}

/* ---------- the one screen ---------- */
function sSurvey(v,b){
  v.className = 'wrap';
  const j = job();
  v.innerHTML = `
    <h1>${esc(j.client) || 'New survey'}</h1>
    <p class="sub">${esc(j.address) || 'No address yet'}${j.quote_no ? ' · ' + esc(j.quote_no) : ''}</p>

    <details${j.client ? '' : ' open'}><summary>Property &amp; specification</summary><div class="inner">
      <label class="f"><span>Client</span><input id="client" value="${esc(j.client)}" autocomplete="off"></label>
      <label class="f"><span>Address</span><input id="address" value="${esc(j.address)}" autocomplete="off"></label>
      <label class="f"><span>Service requested</span><select id="service">
        ${SERVICES.map(s => `<option${s === j.service ? ' selected' : ''}>${s}</option>`).join('')}</select></label>
      <div class="checks">
        ${[['conservation','Conservation area'],['listed','Listed'],['scaffold','Scaffold'],['parking','Parking suspension']]
          .map(([k,l]) => `<label><input type="checkbox" data-site="${k}"${j.site[k] ? ' checked' : ''}>${l}</label>`).join('')}
      </div>
      <label class="f"><span>Timber</span><select id="timber"><option value=""></option>
        ${TIMBERS.map(t => `<option${t === j.spec.timber ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="f"><span>Glazing</span><select id="glazing"><option value=""></option>
        ${GLAZING.map(g => `<option${g === j.spec.glazing ? ' selected' : ''}>${g}</option>`).join('')}</select></label>
      <label class="f"><span>Paint finish</span><input id="finish" value="${esc(j.spec.finish || '')}" placeholder="Teknos — RAL / F&amp;B / NCS"></label>
      <label class="f"><span>Ironmongery finish</span><input id="iron" value="${esc(j.spec.iron || '')}"></label>
      <label class="f"><span>Notes for supplier</span><textarea id="snotes">${esc(j.spec.notes || '')}</textarea></label>
    </div></details>

    <p class="eyebrow">Windows</p>
    <div id="rows"></div>
    <button class="addrow" id="add">+ Add window</button>
    <p class="tally" id="tally"></p>`;

  v.addEventListener('change', e => {
    if(e.target.closest('#rows')) return;
    j.client = val('client'); j.address = val('address'); j.service = val('service');
    v.querySelectorAll('[data-site]').forEach(c => j.site[c.dataset.site] = c.checked);
    j.spec = { ...j.spec, timber:val('timber'), glazing:val('glazing'),
               finish:val('finish'), iron:val('iron'), notes:val('snotes') };
    j.synced = false; save();
    if(e.target.id === 'client' || e.target.id === 'address'){
      v.querySelector('h1').textContent = j.client || 'New survey';
      v.querySelector('.sub').textContent = (j.address || 'No address yet') + (j.quote_no ? ' · ' + j.quote_no : '');
    }
  });

  b.innerHTML = `<button class="btn ghost" id="pdf">PDF</button><button class="btn" id="add2">Add window</button>`;
  el('pdf').onclick  = () => exportPdf(j);
  el('add').onclick  = addRow;
  el('add2').onclick = addRow;
  rows();

  function val(id){ return el(id) ? el(id).value : '' }

  function addRow(){
    j.windows.push({ label:'W' + (j.windows.length + 1), position:'', w:'', h:'', photo:'', notes:'' });
    j.synced = false; save(); rows();
    const last = el('rows').lastElementChild;
    last.querySelector('.wf').focus();
    last.scrollIntoView({ block:'center', behavior:'smooth' });
  }

  function tally(){
    const n = j.windows.length, t = j.windows.reduce((s,w) => s + sqm(w.w,w.h), 0);
    el('tally').textContent = n ? `${n} ${n === 1 ? 'window' : 'windows'} · ${t.toFixed(2)} m² total` : '';
  }

  function rows(){
    el('rows').innerHTML = j.windows.map((w,i) => {
      const a = sqm(w.w,w.h);
      return `<div class="row" data-i="${i}">
        <button class="shotbtn" data-shoot="${i}" aria-label="Photo for ${esc(w.label)}">
          ${w.photo ? `<img src="${w.photo}" alt="">` : 'PHOTO'}
        </button>
        <div>
          <div class="ref"><b>${esc(w.label)}</b>
            <input class="pf" data-i="${i}" value="${esc(w.position)}" placeholder="position" autocomplete="off"></div>
          <div class="dims">
            <input class="wf" data-i="${i}" inputmode="numeric" placeholder="width" value="${esc(w.w)}">
            <div class="x">×</div>
            <input class="hf" data-i="${i}" inputmode="numeric" placeholder="height" value="${esc(w.h)}">
          </div>
          <div class="area"><em class="ar">${a ? a.toFixed(2) + ' m²' : '—'}</em><span class="bd">${band(a)}</span>
            <button class="kill" data-kill="${i}">remove</button></div>
        </div>
      </div>`;
    }).join('');
    tally();
    wire();
  }

  function wire(){
    const rowsEl = el('rows');
    rowsEl.querySelectorAll('.wf, .hf').forEach(inp => inp.oninput = () => {
      const i = +inp.dataset.i, w = j.windows[i];
      inp.value = inp.value.replace(/\D/g,'');
      if(inp.classList.contains('wf')) w.w = inp.value; else w.h = inp.value;
      const a = sqm(w.w,w.h), r = inp.closest('.row');
      r.querySelector('.ar').textContent = a ? a.toFixed(2) + ' m²' : '—';
      r.querySelector('.bd').textContent = band(a);
      j.synced = false; save(); tally();
    });
    rowsEl.querySelectorAll('.pf').forEach(inp => inp.oninput = () => {
      j.windows[+inp.dataset.i].position = inp.value; j.synced = false; save();
    });
    rowsEl.querySelectorAll('[data-shoot]').forEach(btn => btn.onclick = () => shoot(+btn.dataset.shoot));
    rowsEl.querySelectorAll('[data-kill]').forEach(btn => btn.onclick = () => {
      const i = +btn.dataset.kill;
      if(!confirm('Remove ' + j.windows[i].label + '?')) return;
      j.windows.splice(i,1);
      j.windows.forEach((x,n) => x.label = 'W' + (n+1));
      j.synced = false; save(); rows();
    });
  }

  function shoot(i){
    const f = document.createElement('input');
    f.type = 'file'; f.accept = 'image/*'; f.capture = 'environment';
    f.onchange = async () => {
      if(!f.files[0]) return;
      try{ j.windows[i].photo = await shrink(f.files[0]); j.synced = false; save(); rows() }
      catch(e){ toast("Couldn't read that photo — take it again") }
    };
    f.click();
  }
}

/* ---------- photo downscale ---------- */
function shrink(f, max = 1400, q = .72){
  return new Promise((res,rej) => {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej() };
    img.src = url;
  });
}

/* ---------- supplier schedule PDF ---------- */
function exportPdf(j){
  if(!window.jspdf){ toast('Still loading — try again in a moment'); return }
  const live = j.windows.filter(w => w.w || w.h || w.photo);
  if(!live.length){ toast('Nothing to send yet'); return }
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({ unit:'mm', format:'a4' });
  const M = 18, W = 210, ink = [44,43,38], grn = [52,69,62], gry = [92,90,82], hair = [231,226,217];
  let y = M;

  if(LOGO_DATA){
    try{ d.addImage(LOGO_DATA, 'PNG', M, y, 58, 11.4) }catch(e){ wordmark() }
  } else wordmark();
  function wordmark(){
    d.setFont('times','normal'); d.setFontSize(15); d.setTextColor(...grn);
    d.text('KENSINGTON SASH', M, y + 7);
  }
  d.setFont('helvetica','normal'); d.setFontSize(7.5); d.setTextColor(...gry);
  d.text('WINDOW SCHEDULE', W - M, y + 4, { align:'right' });
  d.text(new Date(j.created).toLocaleDateString('en-GB'), W - M, y + 8.6, { align:'right' });
  y += 16; d.setDrawColor(...grn); d.setLineWidth(.5); d.line(M, y, W - M, y); y += 10;

  const meta = [['Property', j.address || '—'], ['Client', j.client || '—'],
                ['Service', j.service || '—'], ['Surveyor', j.surveyor || 'Luke Robertson']]
    .concat([['Timber',j.spec.timber],['Glazing',j.spec.glazing],['Finish',j.spec.finish],['Ironmongery',j.spec.iron]]
      .filter(r => r[1]))
    .concat(j.quote_no ? [['Reference', j.quote_no]] : []);
  meta.forEach((r,i) => {
    const ry = y + Math.floor(i/2) * 6, x = M + (i % 2) * 88;
    d.setFontSize(6.5); d.setTextColor(...gry); d.text(r[0].toUpperCase(), x, ry);
    d.setFontSize(9);   d.setTextColor(...ink); d.text(String(r[1]).slice(0,44), x + 25, ry);
  });
  y += Math.ceil(meta.length/2) * 6 + 8;

  const cols = [M, M+22, M+98, M+130, M+160];
  d.setDrawColor(...hair); d.setLineWidth(.25);
  d.setFontSize(6.5); d.setTextColor(...gry);
  ['REF','POSITION','WIDTH','HEIGHT','AREA'].forEach((h,i) => d.text(h, cols[i], y));
  y += 2.6; d.line(M, y, W - M, y); y += 6;

  live.forEach(w => {
    if(y > 266){ d.addPage(); y = M }
    const a = sqm(w.w,w.h);
    d.setFontSize(9); d.setTextColor(...ink);
    d.text(w.label, cols[0], y);
    d.text(String(w.position || '—').slice(0,40), cols[1], y);
    d.text(w.w ? w.w + ' mm' : '—', cols[2], y);
    d.text(w.h ? w.h + ' mm' : '—', cols[3], y);
    d.text(a ? a.toFixed(2) + ' m²' : '—', cols[4], y);
    y += 3.2; d.line(M, y, W - M, y); y += 6;
  });
  const tot = live.reduce((t,w) => t + sqm(w.w,w.h), 0);
  d.setFontSize(8); d.setTextColor(...gry); d.text(live.length + ' units', cols[1], y + 1);
  d.setTextColor(...ink); d.text(tot.toFixed(2) + ' m²', cols[4], y + 1);

  if(j.spec.notes){
    y += 12; if(y > 250){ d.addPage(); y = M }
    d.setFontSize(6.5); d.setTextColor(...gry); d.text('NOTES', M, y); y += 5;
    d.setFontSize(9); d.setTextColor(...ink); d.text(d.splitTextToSize(j.spec.notes, W - M*2), M, y);
  }

  live.filter(w => w.photo).forEach((w,i) => {
    if(i % 2 === 0){ d.addPage(); y = M }
    d.setFontSize(10); d.setTextColor(...ink);
    d.text(w.label + (w.position ? ' — ' + w.position : ''), M, y);
    if(w.w && w.h){ d.setFontSize(8); d.setTextColor(...gry); d.text(w.w + ' × ' + w.h + ' mm', W - M, y, { align:'right' }) }
    y += 4;
    try{
      const p = d.getImageProperties(w.photo);
      const s = Math.min((W - M*2) / p.width, 108 / p.height);
      d.addImage(w.photo, 'JPEG', M, y, p.width * s, p.height * s);
      y += p.height * s + 12;
    }catch(e){ y += 6 }
  });

  const tag = (j.address || j.client || 'survey').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');
  d.save('Survey — ' + tag + '.pdf');
  syncJob(j);
}

/* ---------- write back to the same enquiry row ---------- */
async function syncJob(j){
  const payload = {
    id:j.id, created:j.created, enquiry_id:j.enquiry_id, surveyor:j.surveyor,
    client:j.client, address:j.address, service:j.service, site:j.site, spec:j.spec,
    windows:j.windows.filter(w => w.w || w.h).map(w => ({
      label:w.label, position:w.position, width:Number(w.w) || null, height:Number(w.h) || null,
      sqm:Number(sqm(w.w,w.h).toFixed(3)), band:band(sqm(w.w,w.h)), notes:w.notes }))
  };
  if(!session){ toast('PDF saved · sign in to send it to the dashboard'); return }
  try{
    await api('rpc/save_survey', { method:'POST', body: JSON.stringify({ payload }) });
    j.synced = true; save(); toast('PDF saved · sent to the dashboard'); netLabel();
  }catch(e){ toast('PDF saved · will send when there is signal') }
}

function netLabel(){
  const pending = db.filter(j => !j.synced && j.windows.some(w => w.w || w.h)).length;
  el('net').textContent = !session ? 'On this phone' : !navigator.onLine ? 'Offline' : pending ? pending + ' to send' : 'Synced';
}
addEventListener('online', async () => {
  netLabel(); await loadBooked();
  for(const j of db.filter(x => !x.synced && x.windows.some(w => w.w || w.h))) await syncJob(j);
  render();
});
addEventListener('offline', netLabel);
el('back').onclick = () => { state.screen = 'list'; render() };
el('back').classList.remove('hide');

/* ---------- boot, with ?e= deep link from the calendar ---------- */
(async function boot(){
  state.screen = 'list'; render();
  loadLogo();
  if(!session) return;
  await loadBooked();
  const e = new URLSearchParams(location.search).get('e');
  if(e){
    const existing = db.find(j => j.enquiry_id === e);
    if(existing){ state.jobId = existing.id; state.screen = 'survey' }
    else { const bk = booked.find(x => String(x.enquiry_id) === e); if(bk){ start(bk); return } }
  }
  render();
})();
</script>
